name: Development checks

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: development-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install PDF test dependencies
        run: python -m pip install --disable-pip-version-check "PyMuPDF>=1.25,<2" "pytesseract>=0.3.13,<1"
      - name: Test portable business rules on disposable database
        run: |
          python -m compileall -q portable_app
          python -m unittest discover -s portable_app -p "test_*.py" -v
      - name: Check frontend JavaScript
        run: node --check portable_app/app.js

  python-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install portable test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "PyMuPDF>=1.25,<2" "pytesseract>=0.3.13,<1"
      - name: Verify portable app without user data
        shell: pwsh
        run: |
          python -m py_compile .\portable_app\server.py .\portable_app\pdf_workflows.py .\portable_app\pdf_intelligence.py .\portable_app\sync_runtime.py .\portable_app\cloud_sync_worker.py .\portable_app\verify_reader.py .\portable_app\verify_sync.py .\portable_app\verify_data.py
          python -m unittest discover -s portable_app -p "test_*.py" -v
          node --check .\portable_app\app.js

      - name: Validate controller
        shell: pwsh
        run: |
          python -m py_compile .\controller\server.py
      - name: Test one-click desktop installation
        shell: pwsh
        run: |
          python .\tools\qa_panel_one_click.py

      - name: Validate current app patch sources
        shell: pwsh
        run: |
          python -m py_compile .\controle_contas\patches.py
          python -m py_compile .\tools\fix_mobile_permanent_access.py

      - name: Validate PowerShell deployment helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\DEPLOY_MOBILE_PERMANENT_ACCESS.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-Host
            throw 'PowerShell do deploy mobile possui erro de sintaxe.'
          }

      - name: Validate panel health endpoint
        shell: pwsh
        run: |
          Select-String '.\controller\server.py' -Pattern '/api/health','CONTROLLER_VERSION = "0.3.2"' | Out-Host

      - name: Validate editable production source
        shell: pwsh
        run: |
          python -m py_compile .\source_current\app.py
          python -m py_compile .\source_current\controle_contas\patches.py
          python -m py_compile .\source_current\controle_contas\cloud_sync.py
          python -m py_compile .\source_current\controle_contas\cloud_mobile_ui.py
          python -m py_compile .\source_current\controle_contas\layout_learning_v2.py
          python -m py_compile .\source_current\controle_contas\web_server.py

      - name: Validate mobile worker and app
        shell: pwsh
        run: |
          node --check .\cloud_mobile\src\index.js
          node --check .\cloud_mobile\public\app.js
          Select-String '.\cloud_mobile\src\index.js' -Pattern 'suggestPaymentsBatch','15 \* 60 \* 1000','suggested_at IS NOT NULL' | Out-Host
          Select-String '.\cloud_mobile\public\app.js' -Pattern 'Copiado para pagamento','remainingCopyMinutes','ENVIADO PARA PAGAMENTO' | Out-Host

      - name: Validate local 1.4.8 build helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\BUILD_AND_INSTALL_LOCAL_1.4.8.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-Host
            throw 'PowerShell do build local 1.4.8 possui erro de sintaxe.'
          }

      - name: Validate local 1.4.9 UI installer
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\BUILD_AND_INSTALL_LOCAL_1.4.9.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-Host
            throw 'PowerShell do build local 1.4.9 possui erro de sintaxe.'
          }

      - name: Validate redesigned desktop chrome
        shell: pwsh
        run: |
          python -m py_compile .\source_current\controle_contas\desktop_dashboard.py
          python -m py_compile .\tools\qa_desktop_dashboard.py
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\BUILD_AND_INSTALL_DESKTOP.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-Host
            throw 'Script único de build desktop possui erro de sintaxe.'
          }
