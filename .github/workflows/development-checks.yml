name: Development checks

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:
  python-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate controller
        shell: pwsh
        run: |
          python -m py_compile .\controller\server.py
      - name: Validate current app patch sources
        shell: pwsh
        run: |
          python -m py_compile .\controle_contas\patches.py
