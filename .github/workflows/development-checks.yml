name: Development checks

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ main ]

jobs:
  python-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate controller
        shell: pwsh
        run: |
          python -m py_compile .\controller\server.py
      - name: Validate current app patch sources
        shell: pwsh
        run: |
          python -m py_compile .\controle_contas\patches.py
          python -m py_compile .\tools\fix_mobile_permanent_access.py

      - name: Validate PowerShell deployment helper
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path '.\tools\DEPLOY_MOBILE_PERMANENT_ACCESS.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-Host
            throw 'PowerShell do deploy mobile possui erro de sintaxe.'
          }

      - name: Validate panel health endpoint
        shell: pwsh
        run: |
          Select-String '.\controller\server.py' -Pattern '/api/health','CONTROLLER_VERSION = "0.3.1"' | Out-Host
