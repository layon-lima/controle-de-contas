name: Build updater 1.4.4

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract tested 1.4.4 snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_src | Out-Null
          Expand-Archive -Path '.\releases\CONTROLE_CONTAS_1.4.4_SOURCE.zip' -DestinationPath '.\release_src' -Force

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Tesseract and Inno Setup
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          choco install innosetup -y --no-progress

      - name: Verify packaged Portuguese OCR data
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          if (!(Test-Path '.\tesseract\por.traineddata')) {
            throw 'por.traineddata ausente no snapshot 1.4.4.'
          }

      - name: Verify mobile/cloud link files
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          if (!(Test-Path '.\controle_contas\cloud_sync.py')) { throw 'cloud_sync.py ausente' }
          if (!(Test-Path '.\controle_contas\cloud_mobile_ui.py')) { throw 'cloud_mobile_ui.py ausente' }
          Select-String '.\app.py' -Pattern 'ensure_cloud_sync_backend','ensure_cloud_sync_autostart','integrate_cloud_mobile_button' | Out-Host

      - name: Validate Python source
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          python -m py_compile .\app.py .\controle_contas\patches.py .\controle_contas\layout_learning_v2.py .\controle_contas\cloud_sync.py .\controle_contas\cloud_mobile_ui.py .\controle_contas\web_server.py

      - name: Build desktop app
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          python -m PyInstaller --clean --noconfirm '.\Controle de Contas.spec'
          if (!(Test-Path '.\dist\Controle de Contas\Controle de Contas.exe')) {
            throw 'Executavel nao foi gerado.'
          }
          if (!(Test-Path '.\dist\Controle de Contas\_internal\tesseract\tessdata\por.traineddata')) {
            throw 'Build nao contem por.traineddata.'
          }

      - name: Build updater
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          $candidatos = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatos | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'ISCC.exe nao encontrado.' }
          & $iscc '.\Controle_de_Contas_1.4.4.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Falha no Inno Setup.' }
          if (!(Test-Path '.\atualizador\ATUALIZADOR_CONTROLE_DE_CONTAS_1.4.4.exe')) {
            throw 'Atualizador nao foi gerado.'
          }

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATUALIZADOR_CONTROLE_DE_CONTAS_1.4.4
          path: release_src/atualizador/ATUALIZADOR_CONTROLE_DE_CONTAS_1.4.4.exe
          if-no-files-found: error
          retention-days: 30
