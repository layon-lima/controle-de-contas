name: Build updater 1.4.7

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract clean 1.4.4 snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release_src | Out-Null
          Expand-Archive -Path '.\releases\CONTROLE_CONTAS_1.4.4_SOURCE.zip' -DestinationPath '.\release_src' -Force

      - name: Apply tested 1.4.5 mobile overlay
        shell: pwsh
        run: |
          $b64 = Get-Content '.\releases\CONTROLE_CONTAS_1.4.5_OVERLAY.b64' -Raw
          [IO.File]::WriteAllBytes('.\overlay_145.zip', [Convert]::FromBase64String($b64))
          Expand-Archive -Path '.\overlay_145.zip' -DestinationPath '.\release_src' -Force

      - name: Apply corrected 1.4.7 search fix
        shell: pwsh
        run: |
          python '.\releases\apply_search_fix_1.4.7.py'

          Copy-Item '.\release_src\version_info_1.4.5.txt' '.\release_src\version_info_1.4.7.txt' -Force
          $version = Get-Content '.\release_src\version_info_1.4.7.txt' -Raw
          $version = $version -replace '\(1, 4, 5, 0\)', '(1, 4, 7, 0)'
          $version = $version -replace '1\.4\.5\.0', '1.4.7.0'
          Set-Content '.\release_src\version_info_1.4.7.txt' $version -Encoding UTF8

          $spec = Get-Content '.\release_src\Controle de Contas.spec' -Raw
          $spec = $spec -replace 'version_info_1\.4\.5\.txt', 'version_info_1.4.7.txt'
          Set-Content '.\release_src\Controle de Contas.spec' $spec -Encoding UTF8

          Copy-Item '.\release_src\Controle_de_Contas_1.4.5.iss' '.\release_src\Controle_de_Contas_1.4.7.iss' -Force
          $iss = Get-Content '.\release_src\Controle_de_Contas_1.4.7.iss' -Raw
          $iss = $iss -replace '1\.4\.5', '1.4.7'
          Set-Content '.\release_src\Controle_de_Contas_1.4.7.iss' $iss -Encoding UTF8

      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Tesseract and Inno Setup
        shell: pwsh
        run: |
          choco install tesseract -y --no-progress
          choco install innosetup -y --no-progress

      - name: Verify 1.4.7 source
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          if (!(Test-Path '.\tesseract\por.traineddata')) { throw 'por.traineddata ausente.' }

          Select-String '.\controle_contas\patches.py' -Pattern '_interpretar_valor_busca_exata','setInterval\(220\)','valor_exato = _interpretar_valor_busca_exata' | Out-Host
          Select-String '.\controle_contas\cloud_mobile_ui.py' -Pattern 'Sugerir pagamento','CÓDIGO COPIADO' | Out-Host
          Select-String '.\controle_contas\cloud_sync.py' -Pattern '/api/desktop/activity','/api/desktop/suggest/' | Out-Host

          @'
          import ast
          from pathlib import Path

          source = Path("controle_contas/patches.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          fn = next(
              n for n in tree.body
              if isinstance(n, ast.FunctionDef) and n.name == "_atualizar_tabela_com_obs"
          )
          loads = [
              n for n in ast.walk(fn)
              if isinstance(n, ast.Name)
              and n.id == "consulta"
              and isinstance(n.ctx, ast.Load)
          ]
          stores = [
              n for n in ast.walk(fn)
              if isinstance(n, ast.Name)
              and n.id == "consulta"
              and isinstance(n.ctx, ast.Store)
          ]
          assert loads, "consulta não é usada na função de atualização"
          assert stores, "consulta é usada sem ser definida na função de atualização"
          print("Consulta scope OK")
          '@ | Set-Content '.\test_scope_147.py' -Encoding UTF8
          python '.\test_scope_147.py'

      - name: Validate Python source
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          python -m py_compile .\app.py .\controle_contas\patches.py .\controle_contas\layout_learning_v2.py .\controle_contas\cloud_sync.py .\controle_contas\cloud_mobile_ui.py .\controle_contas\web_server.py

      - name: Test exact value parser
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          @'
          import ast
          from pathlib import Path

          source = Path("controle_contas/patches.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          wanted = {"_interpretar_valor_busca_exata"}
          nodes = [n for n in tree.body if isinstance(n, ast.FunctionDef) and n.name in wanted]
          ns = {"re": __import__("re")}
          exec(compile(ast.Module(body=nodes, type_ignores=[]), "search_test", "exec"), ns)
          f = ns["_interpretar_valor_busca_exata"]

          assert f("10,00") == 10.0
          assert f("1.234,56") == 1234.56
          assert f("R$ 10") == 10.0
          assert f("10") is None
          print("Exact-value parser OK")
          '@ | Set-Content '.\test_search_147.py' -Encoding UTF8
          python '.\test_search_147.py'

      - name: Build desktop app
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          python -m PyInstaller --clean --noconfirm '.\Controle de Contas.spec'
          $exe = '.\dist\Controle de Contas\Controle de Contas.exe'
          if (!(Test-Path $exe)) { throw 'Executavel nao foi gerado.' }
          if (!(Test-Path '.\dist\Controle de Contas\_internal\tesseract\tessdata\por.traineddata')) {
            throw 'Build nao contem por.traineddata.'
          }
          $v = (Get-Item $exe).VersionInfo.FileVersion
          Write-Host "FileVersion: $v"
          if ($v -notlike '1.4.7*') { throw "Versao incorreta no EXE: $v" }

      - name: Build updater
        shell: pwsh
        run: |
          Set-Location '.\release_src'
          $candidatos = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidatos | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem "$env:ProgramFiles", "${env:ProgramFiles(x86)}", "$env:LOCALAPPDATA\Programs" -Filter ISCC.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $iscc) { throw 'ISCC.exe nao encontrado.' }
          & $iscc '.\Controle_de_Contas_1.4.7.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Falha no Inno Setup.' }
          if (!(Test-Path '.\atualizador\ATUALIZADOR_CONTROLE_DE_CONTAS_1.4.7.exe')) {
            throw 'Atualizador nao foi gerado.'
          }

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: ATUALIZADOR_CONTROLE_DE_CONTAS_1.4.7
          path: release_src/atualizador/ATUALIZADOR_CONTROLE_DE_CONTAS_1.4.7.exe
          if-no-files-found: error
          retention-days: 30
